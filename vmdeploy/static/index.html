<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM Deployer</title>
<style>
  :root { --bg:#0f1420; --card:#171e2e; --line:#26304a; --fg:#e6ebf5; --mut:#8b97b1;
          --accent:#4f8cff; --ok:#37d67a; --err:#ff5c6c; --pend:#f0b429; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:640px; margin:0 auto; padding:28px 18px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--mut); margin:0 0 22px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  label { display:block; font-size:13px; color:var(--mut); margin:14px 0 5px; }
  input, select, textarea { width:100%; padding:9px 11px; background:#0e1422; color:var(--fg);
         border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); }
  textarea { resize:vertical; min-height:60px; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .row { display:flex; gap:12px; } .row > div { flex:1; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { background:#0e1422; color:var(--mut); border:0; padding:8px 18px; cursor:pointer; font:inherit; }
  .seg button.on { background:var(--accent); color:#fff; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
           background:#20304f; color:#a9c2ff; margin-left:8px; vertical-align:middle; }
  .hint { font-size:12px; color:var(--mut); margin-top:5px; }
  .deploy { margin-top:22px; width:100%; padding:12px; font-size:15px; font-weight:600;
            background:var(--accent); color:#fff; border:0; border-radius:9px; cursor:pointer; }
  .deploy:disabled { opacity:.5; cursor:default; }
  .steps { list-style:none; padding:0; margin:16px 0 0; }
  .steps li { padding:6px 0 6px 26px; position:relative; color:var(--mut); font-size:14px; }
  .steps li::before { content:"○"; position:absolute; left:4px; }
  .steps li.done { color:var(--fg); } .steps li.done::before { content:"●"; color:var(--ok); }
  .steps li.active { color:var(--fg); } .steps li.active::before { content:"◐"; color:var(--pend); }
  .result { margin-top:18px; padding:16px; border-radius:10px; display:none; }
  .result.ok { display:block; background:#12301f; border:1px solid #1f6b3f; }
  .result.err { display:block; background:#301418; border:1px solid #7a2530; }
  .result code { background:#0009; padding:2px 6px; border-radius:5px; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  .err-msg { color:var(--err); font-size:13px; margin-top:10px; min-height:18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>VM Deployer</h1>
  <p class="sub">Clone a vCenter template into a new VM — static IP or DHCP, a sudo user, and SSH.</p>

  <div class="card">
    <label>Template</label>
    <select id="template"></select>
    <div class="hint" id="tplHint">Loading templates…</div>

    <label>VM name</label>
    <input id="name" placeholder="web01" autocomplete="off">

    <label>Network</label>
    <div class="seg" id="netseg">
      <button type="button" data-net="static" class="on">Static IP</button>
      <button type="button" data-net="dhcp">DHCP</button>
    </div>

    <div id="staticFields">
      <div class="row">
        <div><label>IP address</label><input id="ip" placeholder="10.0.0.50"></div>
        <div><label>CIDR</label><input id="cidr" value="24"></div>
      </div>
      <div class="row">
        <div><label>Gateway</label><input id="gateway" placeholder="10.0.0.1"></div>
        <div><label>DNS (comma-sep)</label><input id="dns" value="1.1.1.1, 8.8.8.8"></div>
      </div>
    </div>

    <label>Username</label>
    <input id="username" autocomplete="off">

    <label>Password <span class="hint" style="display:inline">(optional if you provide an SSH key)</span></label>
    <input id="password" type="password" autocomplete="new-password">
    <label style="display:flex;align-items:center;gap:8px;margin-top:8px">
      <input type="checkbox" id="pwauth" style="width:auto"> Allow SSH password login
    </label>

    <label>SSH public key <span class="hint" style="display:inline">(optional)</span></label>
    <textarea id="sshkey" placeholder="ssh-ed25519 AAAA…"></textarea>

    <button class="deploy" id="deployBtn">Deploy</button>
    <div class="err-msg" id="formErr"></div>

    <ul class="steps" id="steps" style="display:none"></ul>
    <div class="result" id="result"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const STEPS = ["checking","cloning","injecting","powering-on","waiting-for-ip","done"];
const STEP_LABEL = { checking:"Checking vCenter", cloning:"Cloning template",
  injecting:"Injecting cloud-init", "powering-on":"Powering on",
  "waiting-for-ip":"Waiting for IP", done:"Done" };
let TEMPLATES = [], netMode = "static";

async function loadTemplates() {
  try {
    const [tpls, cfg] = await Promise.all([
      fetch("/api/templates").then(r => { if(!r.ok) throw new Error("api"); return r.json(); }),
      fetch("/api/config").then(r => r.json()).catch(()=>({}))
    ]);
    TEMPLATES = tpls;
    const sel = $("template"); sel.innerHTML = "";
    if (!tpls.length) { $("tplHint").textContent = "No toolkit templates found. Build one with build-template.sh."; return; }
    tpls.forEach((t,i) => {
      const o = document.createElement("option");
      o.value = i; o.textContent = t.name; sel.appendChild(o);
    });
    if (cfg.default_ssh_pubkey) $("sshkey").value = cfg.default_ssh_pubkey;
    sel.onchange = onTemplate; onTemplate();
  } catch(e) {
    $("tplHint").textContent = "Could not reach vCenter — check the container's GOVC_* env.";
  }
}
function onTemplate() {
  const t = TEMPLATES[$("template").value]; if(!t) return;
  $("username").value = t.default_username || "";
  $("tplHint").innerHTML = `profile <b>${t.profile||"?"}</b> · admin group <code>${t.admin_group}</code>` +
    ` · ssh <code>${t.ssh_service}</code> · nic <code>${t.iface}</code>`;
}
$("netseg").onclick = e => {
  if (e.target.tagName !== "BUTTON") return;
  netMode = e.target.dataset.net;
  [...$("netseg").children].forEach(b => b.classList.toggle("on", b===e.target));
  $("staticFields").style.display = netMode === "static" ? "" : "none";
};
function renderSteps(active) {
  const ul = $("steps"); ul.style.display = "block"; ul.innerHTML = "";
  const ai = STEPS.indexOf(active);
  STEPS.forEach((s,i) => {
    const li = document.createElement("li");
    li.textContent = STEP_LABEL[s];
    if (active==="failed") { if(i<ai) li.className="done"; }
    else if (i < ai) li.className = "done";
    else if (i === ai) li.className = "active";
    ul.appendChild(li);
  });
}
async function poll(job) {
  const j = await fetch("/api/jobs/"+job).then(r=>r.json());
  renderSteps(j.step);
  if (j.status === "done") {
    $("result").className = "result ok";
    $("result").innerHTML = `✅ <b>${j.vm}</b> is up on <span class="mono">${j.ip}</span><br>` +
      `<span class="hint">Login: <code class="mono">ssh ${$("username").value}@${j.ip}</code> ` +
      `(give cloud-init ~30–60s)</span>`;
    resetBtn(); return;
  }
  if (j.status === "failed") {
    renderSteps("failed");
    $("result").className = "result err";
    $("result").innerHTML = `❌ Deploy failed:<br><span class="mono">${j.error||"unknown error"}</span>`;
    resetBtn(); return;
  }
  setTimeout(()=>poll(job), 2500);
}
function resetBtn(){ $("deployBtn").disabled=false; $("deployBtn").textContent="Deploy"; }

$("deployBtn").onclick = async () => {
  const t = TEMPLATES[$("template").value];
  $("formErr").textContent = ""; $("result").className = "result";
  if (!t) { $("formErr").textContent = "Pick a template."; return; }
  const spec = {
    template: t.name, admin_group: t.admin_group, ssh_service: t.ssh_service,
    iface: t.iface, username: $("username").value.trim(),
    name: $("name").value.trim(), dhcp: netMode === "dhcp",
    ip: $("ip").value.trim(), cidr: $("cidr").value.trim() || "24",
    gateway: $("gateway").value.trim(), dns: $("dns").value.trim() || "1.1.1.1, 8.8.8.8",
    password: $("password").value || null, ssh_key: $("sshkey").value.trim() || null,
    pwauth: $("pwauth").checked,
  };
  $("deployBtn").disabled = true; $("deployBtn").textContent = "Deploying…";
  try {
    const r = await fetch("/api/deploy", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(spec) });
    const body = await r.json();
    if (!r.ok) { $("formErr").textContent = body.detail || "request failed"; resetBtn(); return; }
    renderSteps("checking"); poll(body.job);
  } catch(e) { $("formErr").textContent = String(e); resetBtn(); }
};
loadTemplates();
</script>
</body>
</html>
