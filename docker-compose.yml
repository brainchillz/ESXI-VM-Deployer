services:
  esxi-vmdeploy:
    build: .
    image: esxi-vmdeploy:latest
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      # Persists runtime settings edited via the ⚙ dialog (/data/settings.json),
      # so they survive container recreation.
      - esxi-vmdeploy-data:/data
    restart: unless-stopped

volumes:
  esxi-vmdeploy-data:
