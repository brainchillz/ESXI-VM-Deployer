services:
  esxi-vmdeploy:
    build: .
    # Published by .github/workflows/docker.yml on every push to main;
    # `docker compose pull` upgrades without a local build.
    image: ghcr.io/brainchillz/esxi-vm-deployer:latest
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      # Persists runtime settings edited via the ⚙ dialog (/data/settings.json),
      # so they survive container recreation.
      - esxi-vmdeploy-data:/data
    restart: unless-stopped

volumes:
  esxi-vmdeploy-data:
